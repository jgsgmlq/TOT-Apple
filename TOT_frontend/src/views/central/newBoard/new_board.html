<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实时任务看板 (Vue 3 独立版)</title>
  
  <!-- 引入外部依赖 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    /* 全局重置与动画 */
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #F9FAFB;
      color: #111827;
      margin: 0;
    }

    h1, h2, h3, .font-outfit {
      font-family: 'Outfit', sans-serif;
      text-wrap: balance;
    }

    p, span, div {
      text-wrap: pretty;
    }

    * {
      transition-timing-function: cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    @keyframes slide-in-from-top-2 {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-in {
      animation: slide-in-from-top-2 0.3s ease-out both;
    }
    
    /* 现代阴影与边框系统替代粗暴的线框 */
    .glass-card {
      background: #FFFFFF;
      box-shadow: 0 4px 24px -6px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(0,0,0,0.03);
      border-radius: 1rem;
    }
    @keyframes alert-pulse {
      0% { 
        transform: scale(0.85); 
        box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.8); 
      }
      70% { 
        transform: scale(1); 
        box-shadow: 0 0 0 8px rgba(255, 59, 48, 0); 
      }
      100% { 
        transform: scale(0.85); 
        box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); 
      }
    }
    @keyframes alert-pulse-yellow {
      0% { 
        transform: scale(0.85); 
        box-shadow: 0 0 0 0 rgba(255, 149, 0, 0.8); 
      }
      70% { 
        transform: scale(1); 
        box-shadow: 0 0 0 8px rgba(255, 149, 0, 0); 
      }
      100% { 
        transform: scale(0.85); 
        box-shadow: 0 0 0 0 rgba(255, 149, 0, 0); 
      }
    }
    .animate-alert-pulse-red {
      animation: alert-pulse 1.5s infinite;
    }
    .animate-alert-pulse-yellow {
      animation: alert-pulse-yellow 1.5s infinite;
      animation-delay: 0.2s;
    }
  </style>
</head>
<body>
  <!-- Vue 应用挂载点 -->
  <div id="app"></div>

  <!-- ================= 主应用模板 ================= -->
  <template id="app-template">
    <div class="h-screen flex flex-col bg-[#F9FAFB] overflow-hidden">
      <!-- Header -->
      <div class="flex-shrink-0 w-full mx-auto px-6 sm:px-10 lg:px-12 xl:px-16 pt-8 pb-6">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
          <h1 class="text-[28px] leading-[1.15] font-semibold text-[#111827] font-outfit">
            实时任务看板
          </h1>
          <div class="flex items-center gap-4">
            <!-- 更新状态区合并 (无边框) -->
            <div class="flex items-center gap-2">
              <div class="text-[13px] text-[#86868B] font-medium">最后更新：{{ formatTime(lastUpdated) }}</div>
              <button @click="handleRefresh" class="text-[#86868B] hover:text-[#0071E3] transition-colors duration-200 flex items-center justify-center p-1 rounded-md hover:bg-gray-100/50" title="手动刷新">
                <icon-refresh-cw size="14"></icon-refresh-cw>
              </button>
            </div>
            
            <button @click="isAiOpen = true" class="p-2.5 rounded-full hover:bg-[#F5F5F7] transition-colors duration-200 relative group" title="AI 数据助手">
              <div class="absolute inset-0 bg-blue-500/10 rounded-full scale-0 group-hover:scale-100 transition-transform duration-300"></div>
              <icon-bot size="18" class="text-[#0071E3] relative z-10"></icon-bot>
              <div class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full border-2 border-[#F9FAFB]"></div>
            </button>
            <button @click="toggleFullscreen" class="p-2.5 rounded-full hover:bg-[#F5F5F7] transition-colors duration-200" :title="isFullscreen ? '退出全屏' : '全屏显示'">
              <icon-minimize v-if="isFullscreen" size="18" color="#0071E3"></icon-minimize>
              <icon-maximize v-else size="18" color="#0071E3"></icon-maximize>
            </button>
          </div>
        </div>
      </div>

      <!-- Toast Prompt -->
      <div :class="['fixed top-6 left-1/2 -translate-x-1/2 z-[200] px-6 py-2.5 bg-gray-800/90 backdrop-blur-md text-white text-[14px] font-medium rounded-full shadow-2xl transition-all duration-500 pointer-events-none', showFullscreenPrompt ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-8']">
        按 ESC 键退出全屏
      </div>

      <!-- Diagnosis Flow Section -->
      <div class="flex-shrink-0">
        <!-- 注意：DOM 模板中，向子组件传递 props 必须使用短横线 (kebab-case) 格式 -->
        <diagnosis-flow
          :diagnoses="diagnosisData"
          :all-tasks="allTasks"
          :current-task-id="currentTaskId"
          :is-collapsed="isDiagnosisCollapsed"
          @select-diagnosis="handleSelectDiagnosis"
          @select-task="handleSelectTask"
          @toggle-collapse="isDiagnosisCollapsed = !isDiagnosisCollapsed"
          @force-collapse="isDiagnosisCollapsed = true"
        ></diagnosis-flow>
      </div>

      <!-- Dashboard Content -->
      <div class="flex-1 overflow-y-auto">
        <div :class="['transition-opacity duration-250', isContentLoading ? 'opacity-0' : 'opacity-100']">
          <div class="w-full mx-auto px-6 sm:px-10 lg:px-12 xl:px-16">
            <!-- Layer 2: Core Metrics + Funnel -->
            <div class="mt-8 flex flex-col lg:flex-row gap-5 items-stretch">
              <div class="lg:w-[320px] flex-shrink-0 flex flex-col z-10">
                <metric-cards :funnel-data="funnelData" :alert-summary="alertSummary" class="flex-1"></metric-cards>
              </div>
              <div class="flex-1 glass-card p-5 md:p-6 flex flex-col min-w-0">
                <div class="flex items-center gap-1.5 mb-4 group relative w-fit cursor-help">
                  <h3 class="text-[18px] leading-[1.3] font-semibold text-[#111827] font-outfit">转化漏斗</h3>
                  <icon-help-circle size="16" class="text-[#9CA3AF] group-hover:text-[#6B7280] transition-colors"></icon-help-circle>
                  <div class="absolute left-full ml-3 top-1/2 -translate-y-1/2 w-64 bg-gray-900 text-white text-[12px] font-normal leading-relaxed rounded-lg py-2.5 px-3.5 opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity duration-200 z-[999] text-left shadow-lg">
                    展示任务生命周期各阶段的转化和流失情况。流失率达到 20% 时会触发系统自动标红预警。
                  </div>
                </div>
                <div class="flex-1 flex flex-col justify-center">
                  <funnel-chart :funnel-data="funnelData" class="w-full" @drill-down="handleFunnelDrillDown"></funnel-chart>
                </div>
              </div>
            </div>

            <!-- Layer 3: Unified Alert Block -->
            <div class="mt-16">
              <div class="flex items-center gap-1.5 mb-6 group relative w-fit cursor-help">
                <h3 class="text-[18px] leading-[1.3] font-semibold text-[#111827] font-outfit">预警中心</h3>
                <icon-help-circle size="16" class="text-[#9CA3AF] group-hover:text-[#6B7280] transition-colors"></icon-help-circle>
                <div class="absolute left-full ml-3 top-1/2 -translate-y-1/2 w-56 bg-gray-900 text-white text-[12px] font-normal leading-relaxed rounded-lg py-2.5 px-3.5 opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity duration-200 z-[999] text-left shadow-lg">
                  实时展示诊断出的各层级业务风险项，漏斗图展示了高危风险逐步缩口的转化情况。
                </div>
              </div>
              <div class="flex flex-col lg:flex-row gap-5 items-stretch">
                <div class="lg:w-[320px] flex-shrink-0 flex flex-col z-10">
                  <alert-summary :alert-summary="alertSummary" :funnel-data="alertFunnelData" :current-filter="alertFilter" @view-alerts="handleSelectAlertFilter" class="flex-1"></alert-summary>
                </div>
                <div class="flex-1 glass-card p-5 md:p-6 flex flex-col min-w-0">
                  <div class="flex items-center gap-1.5 mb-4 group relative w-fit cursor-help">
                    <h3 class="text-[18px] leading-[1.3] font-semibold text-[#111827] font-outfit">预警风险漏斗</h3>
                    <icon-help-circle size="16" class="text-[#9CA3AF] group-hover:text-[#6B7280] transition-colors"></icon-help-circle>
                    <div class="absolute left-full ml-3 top-1/2 -translate-y-1/2 w-64 bg-gray-900 text-white text-[12px] font-normal leading-relaxed rounded-lg py-2.5 px-3.5 opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity duration-200 z-[999] text-left shadow-lg">
                      漏斗图展示了各阶段异常向更严重状态发展的转化情况。点击可下钻明细表。
                    </div>
                  </div>
                  <div class="flex-1 flex flex-col justify-center">
                    <alert-funnel :funnel-data="alertFunnelData" :active-filter="alertFilter" @drill-down="handleDrillDownAlerts" class="w-full"></alert-funnel>
                  </div>
                </div>
              </div>
            </div>

            <!-- Layer 4: Trend Chart + Region Ranking -->
            <div class="mt-16 mb-16 flex flex-col lg:flex-row gap-6 items-stretch">
              <div class="lg:w-1/2 flex-shrink-0 min-w-0 flex flex-col glass-card p-6 md:p-8 z-10">
                <trend-chart :trend-data="trendData" class="w-full flex-1"></trend-chart>
              </div>
              <div class="lg:w-1/2 flex-shrink-0 min-w-0 flex flex-col glass-card p-6 md:p-8">
                <region-ranking :region-data="regionData" :alert-summary="alertSummary" class="w-full flex-1"></region-ranking>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- AI Assistant Drawer -->
      <ai-assistant :is-open="isAiOpen" @close="isAiOpen = false"></ai-assistant>

      <!-- Funnel Drill Modal -->
      <funnel-drill-modal
        :is-open="isFunnelModalOpen"
        :stage="selectedFunnelStage"
        :task-id="currentTaskId"
        @close="isFunnelModalOpen = false"
      ></funnel-drill-modal>

      <!-- Alert Drill Modal -->
      <alert-drill-modal
        :is-open="isAlertModalOpen"
        :filter="alertFilter"
        :alerts="alerts"
        @close="isAlertModalOpen = false"
      ></alert-drill-modal>
    </div>
  </template>

  <!-- ================= 组件模板 ================= -->
  
  <template id="ai-assistant">
    <div :class="['fixed inset-0 z-[300] flex justify-end transition-all duration-300', isOpen ? 'visible pointer-events-auto' : 'invisible pointer-events-none']">
      <!-- Backdrop -->
      <div :class="['absolute inset-0 bg-black/20 backdrop-blur-sm transition-opacity duration-300', isOpen ? 'opacity-100' : 'opacity-0']" @click="$emit('close')"></div>
      
      <!-- Drawer Panel -->
      <div :class="['relative w-full max-w-[400px] h-full bg-[#FAFAFA] shadow-2xl flex flex-col transition-transform duration-300 ease-in-out', isOpen ? 'translate-x-0' : 'translate-x-full']">
        
        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4 bg-white border-b border-gray-100 flex-shrink-0">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center border border-blue-100/50">
              <icon-bot size="18" color="#0071E3"></icon-bot>
            </div>
            <div>
              <h3 class="text-[16px] font-bold text-[#111827] font-outfit leading-tight">AI 数据助手</h3>
              <p class="text-[12px] text-[#6B7280]">基于当前看板进行智能问答</p>
            </div>
          </div>
          <button @click="$emit('close')" class="p-2 rounded-full hover:bg-gray-100 transition-colors">
            <icon-x size="18" color="#6B7280"></icon-x>
          </button>
        </div>
        
        <!-- Chat Area -->
        <div class="flex-1 overflow-y-auto p-5 space-y-5" id="chat-container">
          <div v-for="(msg, index) in messages" :key="index" :class="['flex w-full', msg.role === 'user' ? 'justify-end' : 'justify-start']">
            <div v-if="msg.role === 'ai'" class="w-8 h-8 rounded-full bg-white border border-gray-200 flex items-center justify-center flex-shrink-0 mr-3 mt-1 shadow-sm">
              <icon-bot size="16" color="#0071E3"></icon-bot>
            </div>
            <div :class="['max-w-[80%] px-4 py-3 text-[14px] leading-relaxed shadow-sm', msg.role === 'user' ? 'bg-[#0071E3] text-white rounded-2xl rounded-tr-sm' : 'bg-white text-[#111827] border border-gray-100 rounded-2xl rounded-tl-sm']" v-html="msg.content">
            </div>
          </div>
          
          <div v-if="isTyping" class="flex w-full justify-start">
             <div class="w-8 h-8 rounded-full bg-white border border-gray-200 flex items-center justify-center flex-shrink-0 mr-3 mt-1 shadow-sm">
              <icon-bot size="16" color="#0071E3"></icon-bot>
            </div>
            <div class="px-4 py-4 rounded-2xl bg-white border border-gray-100 shadow-sm rounded-tl-sm flex items-center gap-1.5 h-[46px]">
              <div class="w-1.5 h-1.5 bg-[#86868B] rounded-full animate-bounce" style="animation-delay: 0ms;"></div>
              <div class="w-1.5 h-1.5 bg-[#86868B] rounded-full animate-bounce" style="animation-delay: 150ms;"></div>
              <div class="w-1.5 h-1.5 bg-[#86868B] rounded-full animate-bounce" style="animation-delay: 300ms;"></div>
            </div>
          </div>
        </div>
        
        <!-- Input Area -->
        <div class="p-4 bg-white border-t border-gray-100 flex-shrink-0">
          <!-- Suggestion Chips -->
          <div class="flex gap-2 overflow-x-auto pb-3 mb-1 no-scrollbar whitespace-nowrap">
            <button @click="sendSuggestion('分析一下当前的 P0 危机')" class="px-3 py-1.5 bg-[#F5F5F7] hover:bg-gray-200 text-[#111827] text-[12px] rounded-full transition-colors font-medium">分析 P0 危机</button>
            <button @click="sendSuggestion('哪个任务进度最落后？')" class="px-3 py-1.5 bg-[#F5F5F7] hover:bg-gray-200 text-[#111827] text-[12px] rounded-full transition-colors font-medium">哪个任务最落后？</button>
            <button @click="sendSuggestion('总结大盘整体情况')" class="px-3 py-1.5 bg-[#F5F5F7] hover:bg-gray-200 text-[#111827] text-[12px] rounded-full transition-colors font-medium">总结大盘情况</button>
          </div>
          <div class="relative flex items-end gap-2 bg-[#F5F5F7] rounded-xl p-1.5 border border-transparent focus-within:border-blue-500 focus-within:bg-white transition-all duration-200">
            <textarea v-model="inputText" @keydown.enter.prevent="sendMessage" placeholder="询问关于任务进度、预警详情..." rows="1" class="flex-1 max-h-24 bg-transparent border-none outline-none resize-none text-[14px] text-[#111827] py-2 px-3 placeholder:text-[#86868B]"></textarea>
            <button @click="sendMessage" :disabled="!inputText.trim() || isTyping" :class="['p-2 rounded-lg flex-shrink-0 transition-colors duration-200 mb-0.5 mr-0.5', (inputText.trim() && !isTyping) ? 'bg-[#0071E3] text-white hover:bg-blue-600 shadow-md' : 'bg-gray-200 text-gray-400']">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
          </div>
          <div class="text-center mt-3">
            <span class="text-[11px] text-[#9CA3AF]">AI 内容由模型生成，仅供辅助参考</span>
          </div>
        </div>
      </div>
    </div>
  </template>

  
  <template id="funnel-drill-modal">
    <div :class="['fixed inset-0 z-[400] flex items-center justify-center transition-opacity duration-300', isOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none']">
      <!-- Backdrop -->
      <div class="absolute inset-0 bg-black/30 backdrop-blur-sm" @click="$emit('close')"></div>
      
      <!-- Modal Content -->
      <div :class="['relative w-full max-w-4xl max-h-[85vh] bg-white rounded-2xl shadow-2xl flex flex-col mx-4 md:mx-auto transition-transform duration-300 delay-75', isOpen ? 'scale-100 translate-y-0' : 'scale-95 translate-y-4']">
        <div class="flex items-center justify-between px-6 py-5 border-b border-gray-100 flex-shrink-0">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center text-[#0071E3]">
              <icon-trending-up size="16"></icon-trending-up>
            </div>
            <div>
              <h3 class="text-[18px] font-bold text-[#111827] font-outfit">{{ stageLabel }}阶段 - 数据下钻</h3>
              <p class="text-[13px] text-[#6B7280] mt-0.5">查看各层级在当前链路节点的转化情况</p>
            </div>
          </div>
          <button @click="$emit('close')" class="p-2 rounded-full hover:bg-gray-100 transition-colors">
            <icon-x size="18" color="#6B7280"></icon-x>
          </button>
        </div>
        
        <div class="flex-1 p-6 overflow-hidden flex flex-col min-h-0 bg-[#F9FAFB]/50 rounded-b-2xl">
          <div class="flex flex-col mb-4 gap-3 flex-shrink-0">
            <div>
              <h3 class="text-[16px] leading-[1.3] font-semibold text-[#111827] flex items-center flex-wrap gap-2">
                <span @click="goToBreadcrumb('root')" :class="['cursor-pointer transition-colors duration-200', selectedRTM3 ? 'text-[#86868B] hover:text-[#0071E3]' : 'text-[#111827]']">全部 {{ stageLabel }}明细</span>
                <template v-if="selectedRTM3">
                  <icon-chevron-right size="16" class="text-[#86868B] flex-shrink-0"></icon-chevron-right>
                  <span @click="goToBreadcrumb('rtm3')" :class="['transition-colors duration-200', selectedRTM4 ? 'text-[#86868B] hover:text-[#0071E3] cursor-pointer' : 'text-[#111827]']">{{ selectedRTM3 }}</span>
                </template>
                <template v-if="selectedRTM4">
                  <icon-chevron-right size="16" class="text-[#86868B] flex-shrink-0"></icon-chevron-right>
                  <span @click="goToBreadcrumb('rtm4')" :class="['transition-colors duration-200', selectedDealer ? 'text-[#86868B] hover:text-[#0071E3] cursor-pointer' : 'text-[#111827]']">{{ selectedRTM4 }}</span>
                </template>
                <template v-if="selectedDealer">
                  <icon-chevron-right size="16" class="text-[#86868B] flex-shrink-0"></icon-chevron-right>
                  <span class="text-[#111827]">{{ selectedDealer }}</span>
                </template>
              </h3>
              <p class="text-[12px] text-[#86868B] mt-1">
                {{ selectedRTM3 ? ('已下钻至: ' + (selectedDealer ? '门店' : (selectedRTM4 ? '经销商' : 'RTM4'))) : '点击行项可向下钻取数据' }}
              </p>
            </div>
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div class="flex items-center bg-gray-100/80 p-1 rounded-lg flex-shrink-0 overflow-x-auto">
                <button v-for="dim in availableDimensions" :key="dim.value" 
                        @click="currentDimension = dim.value"
                        :class="['px-4 py-1.5 text-[13px] font-semibold rounded-md transition-all duration-200 whitespace-nowrap', currentDimension === dim.value ? 'bg-white text-[#111827] shadow-sm' : 'text-[#6B7280] hover:text-[#111827]']">
                  {{ dim.label }}
                </button>
              </div>
              <div class="relative flex-1 sm:max-w-[240px]">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <icon-search size="14" color="#9CA3AF"></icon-search>
                </div>
                <input v-model="searchQuery" type="text" placeholder="搜索名称..." class="w-full h-9 pl-9 pr-3 text-[13px] text-[#111827] bg-white border border-gray-200 focus:border-[#0071E3] focus:ring-1 focus:ring-[#0071E3] rounded-lg outline-none transition-all duration-200 shadow-sm" />
              </div>
            </div>
          </div>
          
          <div class="border border-[#E5E5E7] bg-white rounded-xl overflow-hidden flex-1 flex flex-col shadow-sm">
            <div class="overflow-y-auto flex-1">
              <table class="w-full border-collapse relative">
                <thead class="sticky top-0 z-10 bg-[#FAFAFA] shadow-[0_1px_0_#E5E5E7]">
                  <tr>
                    <th class="w-40 text-left py-3 px-6 text-[13px] font-medium text-[#6E6E73] whitespace-nowrap">{{ dimensionLabel }}名称</th>
                    <th class="w-32 text-right py-3 px-6 text-[13px] font-medium text-[#6E6E73] cursor-pointer hover:text-[#111827] select-none" @click="handleSort('total')"><div class="flex items-center justify-end">大盘总人数 <icon-sort :active="sortKey === 'total'" :order="sortOrder"></icon-sort></div></th>
                    <th class="w-32 text-right py-3 px-6 text-[13px] font-medium text-[#6E6E73] cursor-pointer hover:text-[#111827] select-none" @click="handleSort('count')"><div class="flex items-center justify-end">{{ stageLabel }}人数 <icon-sort :active="sortKey === 'count'" :order="sortOrder"></icon-sort></div></th>
                    <th class="w-32 text-right py-3 px-6 text-[13px] font-medium text-[#6E6E73] cursor-pointer hover:text-[#111827] select-none" @click="handleSort('rate')"><div class="flex items-center justify-end">{{ stageLabel }}率 <icon-sort :active="sortKey === 'rate'" :order="sortOrder"></icon-sort></div></th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-if="tableData.length === 0">
                    <td colspan="4" class="py-12 text-center text-[13px] text-[#86868B]">暂无匹配数据</td>
                  </tr>
                  <tr v-for="(item, index) in tableData" :key="index" 
                      @click="currentDimension !== 'store' && handleDrillDown(item)"

    const getMockDrillData = (stageId, dimension, seed = '') => {
       // “推送”的逻辑是系统发起，对所有人都是100%（或接近100%由于极少数账号异常，这里直接设为1.0）
       const isPushed = stageId === 'pushed';
       // 各阶段的基础均值，除了推送外允许有合理波动
       const stageRates = { pushed: 1.0, delivered: 0.96, read: 0.82, in_progress: 0.55, completed: 0.35 };
       const baseRate = stageRates[stageId] || 0.5;
       
       const dims = {
           rtm3: ['Monobrand', 'Multibrand', 'Carrier', 'Education'],
           rtm4: ['MONO', 'Lifestyle', 'Mass Merchant', 'Campus'],
           dealer: ['鼎盛科技', '华联商贸', '盛达通讯', '新时代电子', '恒大通讯', '远方科技', '创世商贸', '蓝天数码'],
           store: ['北京国贸店', '上海七宝店', '广州天环广场店', '深圳万象城店', '成都太古里店', '重庆万象城店', '武汉恒隆广场店', '杭州万象城店', '南京景枫中心店', '沈阳市府恒隆店', '苏州中心店', '宁波中心店', '青岛万象城店', '济南恒隆广场店', '天津大悦城店']
       };
       
       const list = dims[dimension] || dims.rtm3;
       return list.map(name => {
           // 用名字和层级seed生成一个伪随机哈希，保证数据稳定不变但下钻后有变化
           const hash = (name + seed).split('').reduce((a, b) => a + b.charCodeAt(0), 0);
           
           // 各层级人数基数控制
           let baseTotal = 1000;
           if(dimension === 'rtm3') baseTotal = 4000;
           if(dimension === 'rtm4') baseTotal = 2500;
           if(dimension === 'dealer') baseTotal = 800;
           if(dimension === 'store') baseTotal = 20;
           
           const total = baseTotal + (hash * 13 % (baseTotal * 0.8));
           
           let rate = 1.0;
           if (!isPushed) {
               // “非推送”阶段才允许存在波动
               const vary = ((hash * 7) % 20) / 100 - 0.1; // -10% 到 +10% 波动
               rate = Math.min(1, Math.max(0, baseRate + vary));
               
               // 如果是门店，波动可以稍微大一点（单店特殊情况多）
               if (dimension === 'store') {
                   const storeVary = ((hash * 11) % 30) / 100 - 0.15; // -15% 到 +15% 波动
                   rate = Math.min(1, Math.max(0, baseRate + storeVary));
               }
           }
           
           // 推送阶段或者计算结果为100%，则人数=总人数
           let count = Math.round(total * rate);
           if (count > total) count = total; // 容错拦截

           return {
               name,
               total: Math.round(total),
               count: count,
               rate: count / total // 反算真实的比例展示
           };
       }).sort((a, b) => b.rate - a.rate); // 按照转化率降序排列
    };

    const DiagnosisFlow = {
      props: ['diagnoses', 'allTasks', 'currentTaskId', 'isCollapsed'],
      template: '#diagnosis-flow',
      setup(props, { emit }) {
        const expandedTasks = ref(false);
        const isAutoCollapsed = ref(true);
        let isFirstLoad = true;
        
        const currentTaskTitle = computed(() => {
          const task = (props.allTasks || []).find(t => t.task_id === props.currentTaskId);
          return task ? task.task_title : '';
        });

        watch(() => props.currentTaskId, (newId) => {
          if (newId) {
            const hasSpecificDiagnosis = (props.diagnoses || []).some(d => d.related_task_id === newId && d.severity !== 'green');
            if (hasSpecificDiagnosis) {
               isAutoCollapsed.value = true;
            } else {
               isAutoCollapsed.value = false;
               emit('forceCollapse');
            }
            isFirstLoad = false;
          }
        });

        const handleDiagnosisClick = (diagnosis) => {
          if (diagnosis.action_type === 'none') {
            toggleExpandedTasks();
          } else if (diagnosis.severity !== 'green') {
            isFirstLoad = false;
            isAutoCollapsed.value = true;
            emit('selectDiagnosis', diagnosis);
          }
        };

        const handleTaskSelect = (taskId) => {
          isFirstLoad = false;
          if (taskId === props.currentTaskId) {
            const hasSpecificDiagnosis = (props.diagnoses || []).some(d => d.related_task_id === taskId && d.severity !== 'green');
            if (hasSpecificDiagnosis) {
              isAutoCollapsed.value = true;
            } else {
              isAutoCollapsed.value = false;
              emit('forceCollapse');
            }
          }
          emit('selectTask', taskId);
          expandedTasks.value = false;
        };

        const toggleExpandedTasks = () => expandedTasks.value = !expandedTasks.value;
        const severityColors = { red: '#FF3B30', yellow: '#FF9500', green: '#34C759' };
        const redCount = computed(() => (props.diagnoses || []).filter(d => d.severity === 'red').length);
        const yellowCount = computed(() => (props.diagnoses || []).filter(d => d.severity === 'yellow').length);
        const greenCount = computed(() => {
          const alertTasksCount = redCount.value + yellowCount.value;
          const totalTasks = (props.allTasks || []).length;
          return Math.max(0, totalTasks - alertTasksCount);
        });
        return { expandedTasks, isAutoCollapsed, currentTaskTitle, handleDiagnosisClick, handleTaskSelect, toggleExpandedTasks, severityColors, redCount, yellowCount, greenCount };
      }
    };

          if (index === 0 || !props.funnelData?.funnel) return 0;
          const prev = props.funnelData.funnel[index - 1].count;
          const curr = props.funnelData.funnel[index].count;
          return ((prev - curr) / prev) * 100;
        };
        const isWorstDrop = (index) => {
          const drop = props.funnelData?.worst_drop;
          if (!drop || index === 0 || !props.funnelData?.funnel) return false;
          return props.funnelData.funnel[index - 1].stage === drop.from_stage && props.funnelData.funnel[index].stage === drop.to_stage;
        };
        const getDropWidth = (index) => {
          if (!props.funnelData?.funnel) return 0;
          const prev = props.funnelData.funnel[index - 1].count;
          const curr = props.funnelData.funnel[index].count;

        }, { immediate: true });

        const dimensionLabel = computed(() => {
          return availableDimensions.value.find(d => d.value === currentDimension.value)?.label || '门店';
        });

        const allAlerts = computed(() => props.alerts?.alerts || []);
        const filteredAlerts = computed(() => {
          let alerts = allAlerts.value;
          if (filter.value === 'Unfinished') {
             alerts = alerts.filter(a => a.completed_count < a.total_employees).map(a => ({
                 ...a,
                 level: 'Unfinished',
                 risk_rate: 1 - ((a.completed_count || 0) / (a.total_employees || 1))
             }));
          } else {
             alerts = alerts.filter(a => a.level === filter.value);
          }
          if (selectedRTM3.value) alerts = alerts.filter(a => a.rtm3 === selectedRTM3.value);
          if (selectedRTM4.value) alerts = alerts.filter(a => a.rtm4 === selectedRTM4.value);
          if (selectedDealer.value) alerts = alerts.filter(a => a.dealer === selectedDealer.value);
          return alerts;
        });
        
        const groupedAlerts = computed(() => {
          const raw = filteredAlerts.value;
          let results = [];
          
          if (currentDimension.value === 'store') {
            results = raw.map(a => ({ 
              ...a, 
              entity_name: a.store || a.related_entity 
            }));
          } else {
            const map = {};
            raw.forEach(a => {
              const key = a[currentDimension.value] || '未知';
              if (!map[key]) {
                map[key] = {
                  alert_id: key + '-' + a.level,
                  level: a.level,
                  entity_name: key,
                  total_employees: 0,
                  completed_count: 0,
                  risk_rate: 0,
                  count: 0
                };
              }
              map[key].total_employees += (a.total_employees || 0);
              map[key].completed_count += (a.completed_count || 0);
              map[key].risk_rate += (a.risk_rate || 0);
              map[key].count += 1;
            });

            results = Object.values(map).map(g => {
              g.risk_rate = g.count > 0 ? (g.risk_rate / g.count) : 0;
              return g;
            });
          }

          if (searchQuery.value.trim()) {
            const q = searchQuery.value.trim().toLowerCase();
            results = results.filter(r => (r.entity_name || '').toLowerCase().includes(q));
          }

          return results.sort((a, b) => {
            const valA = a[sortKey.value] || 0;
            const valB = b[sortKey.value] || 0;
            if (valA < valB) return sortOrder.value === 'asc' ? -1 : 1;
            if (valA > valB) return sortOrder.value === 'asc' ? 1 : -1;
            return 0;
          });
        });

        const displayedAlerts = computed(() => showMore.value ? groupedAlerts.value : groupedAlerts.value.slice(0, 10));

        return { 
          filter, showMore, toggleShowMore, currentDimension, availableDimensions, dimensionLabel, 
          displayedAlerts, groupedAlerts, searchQuery, sortKey, sortOrder, handleSort,
          selectedRTM3, selectedRTM4, selectedDealer, goToBreadcrumb, handleDrillDown
        };
      }
    };

    // 使用字符串模板防止 ECharts 的容器被错误解析
    const TrendChart = {
      props: ['trendData'],
      template: `
        <div style="width: 100%; display: flex; flex-direction: column; height: 100%;">
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-6 gap-4 flex-shrink-0">
            <div class="flex items-center gap-1.5 group relative w-fit cursor-help">
              <h3 class="text-[18px] leading-[1.3] font-semibold text-[#111827] font-outfit">完成趋势</h3>
              <icon-help-circle size="16" class="text-[#9CA3AF] group-hover:text-[#6B7280] transition-colors"></icon-help-circle>
              <div class="absolute left-full ml-3 top-1/2 -translate-y-1/2 w-64 bg-gray-900 text-white text-[12px] font-normal leading-relaxed rounded-lg py-2.5 px-3.5 opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity duration-200 z-[999] text-left shadow-lg">
                显示大盘在所选时间段内的推进情况。折线代表历史累计完成人数，柱状图代表各个节点的单日/单时新增完成人数。
              </div>
            </div>
            <div class="flex items-center gap-3">
              <!-- Select Week/Date -->
              <select v-model="currentSubPeriod" class="h-8 pl-3 pr-8 py-0 text-[12px] text-[#111827] bg-[#F5F5F7] border border-transparent focus:border-[#0071E3] focus:bg-white rounded-md outline-none cursor-pointer transition-all duration-200 appearance-none" style="background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2214%22%20height%3D%2214%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2386868B%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m6%209%206%206%206-6%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 8px center;">
                <option v-for="opt in subPeriodOptions" :key="opt" :value="opt">{{ opt }}</option>
              </select>
              
              <!-- Toggle Dimension -->
              <div class="flex items-center bg-[#F5F5F7] p-1 rounded-lg">
                <button @click="currentDim = 'daily'" :class="['px-3 py-1 text-[12px] font-medium rounded-md transition-all duration-200', currentDim === 'daily' ? 'bg-white text-[#111827] shadow-sm' : 'text-[#6B7280] hover:text-[#111827]']">日</button>
                <button @click="currentDim = 'hourly'" :class="['px-3 py-1 text-[12px] font-medium rounded-md transition-all duration-200', currentDim === 'hourly' ? 'bg-white text-[#111827] shadow-sm' : 'text-[#6B7280] hover:text-[#111827]']">时</button>
              </div>
            </div>
          </div>
          <div style="flex: 1; width: 100%; min-height: 280px; position: relative;">
            <div ref="chartRef" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0;"></div>
          </div>
        </div>
      `,
      setup(props) {
        const chartRef = ref(null);
        let chartInstance = null;
        
        const currentDim = ref('daily');
        const currentSubPeriod = ref('');

        const subPeriodOptions = computed(() => {
          if (!props.trendData) return [];
          const keys = Object.keys(props.trendData[currentDim.value] || {});
          return keys;
        });

        watch(() => props.trendData, (newData) => {
          if (!newData) return;
          const keys = Object.keys(newData[currentDim.value] || {});
          if (keys.length > 0) {
            if (!keys.includes(currentSubPeriod.value)) {
              currentSubPeriod.value = keys[0];
            } else {
              nextTick(renderChart);
            }
          }
        }, { deep: true, immediate: true });
        
        watch(currentDim, (newDim) => {
          if (!props.trendData) return;
          const keys = Object.keys(props.trendData[newDim] || {});
          if (keys.length > 0) {
            currentSubPeriod.value = keys[0];
          } else {
            currentSubPeriod.value = '';
          }
        });
        
        watch(currentSubPeriod, () => {
          nextTick(renderChart);
        });

        const renderChart = () => {
          if (!chartRef.value || !props.trendData) return;
          
          let activeData = [];
          if (currentSubPeriod.value && props.trendData[currentDim.value]) {
             activeData = props.trendData[currentDim.value][currentSubPeriod.value] || [];
          }

          if (chartInstance) chartInstance.dispose();
          
          if (typeof echarts !== 'undefined') {
            chartInstance = echarts.init(chartRef.value);

            const xAxisData = activeData.map(d => d.time);
            const incrementData = activeData.map(d => d.increment);
            const cumulativeData = activeData.map(d => d.cumulative);

            const option = {
              grid: { top: 30, right: 10, left: 10, bottom: 20, containLabel: true },
              tooltip: { 
                trigger: 'axis',
                axisPointer: {
                  type: 'shadow',
                  shadowStyle: { color: 'rgba(0, 0, 0, 0.03)' }
                },
                backgroundColor: 'rgba(255, 255, 255, 0.95)', 
                borderColor: '#F3F4F6', 
                borderWidth: 1,
                padding: [12, 16],
                textStyle: { color: '#111827', fontFamily: 'Outfit, Plus Jakarta Sans, sans-serif' },
                extraCssText: 'box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); border-radius: 8px;',
                formatter: (params) => {
                  let res = `<div style="font-weight:600;margin-bottom:8px;color:#6B7280;font-size:12px;letter-spacing:0.5px;">${params[0].name}</div>`;
                  params.forEach(p => {
                    const color = p.seriesName === '增量' ? '#8CC4FF' : '#0071E3';
                    res += `<div style="display:flex;align-items:center;gap:12px;font-size:14px;margin-top:6px;">
                              <span style="width:8px;height:8px;border-radius:50%;background-color:${color}"></span>
                              <span style="color:#4B5563;font-weight:500;">${p.seriesName}</span>
                              <span style="font-weight:700;color:#111827;margin-left:auto;font-family:'Outfit'">${p.value.toLocaleString()}</span>
                            </div>`;
                  });
                  return res;
                }
              },
              xAxis: { 
                type: 'category', 
                boundaryGap: true, 
                data: xAxisData, 
                axisLine: { lineStyle: { color: '#E5E5E7' } }, 
                axisTick: { show: false }, 
                axisLabel: { color: '#86868B', fontSize: 11, margin: 12 } 
              },
              yAxis: [
                { 
                  type: 'value', 
                  name: '累计完成',
                  nameTextStyle: { color: '#86868B', fontSize: 11, align: 'right' },
                  splitLine: { lineStyle: { color: '#F5F5F7', type: 'dashed' } }, 
                  axisLabel: { color: '#86868B', fontSize: 11 } 
                },
                { 
                  type: 'value', 
                  name: '单期增量',
                  nameTextStyle: { color: '#86868B', fontSize: 11, align: 'left' },
                  splitLine: { show: false }, 
                  axisLabel: { color: '#86868B', fontSize: 11 } 
                }
              ],
              series: [
                { 
                  name: '增量', 
                  data: incrementData, 
                  type: 'bar', 
                  yAxisIndex: 1,
                  barMaxWidth: 32,
                  itemStyle: { color: '#D0E2FF', borderRadius: [4, 4, 0, 0] },
                  emphasis: { itemStyle: { color: '#A4D9FF' } }
                },
                { 
                  name: '累计', 
                  data: cumulativeData, 
                  type: 'line', 
                  yAxisIndex: 0,
                  smooth: 0.3, 
                  itemStyle: { color: '#0071E3' }, 
                  lineStyle: { width: 3, shadowColor: 'rgba(0,113,227,0.2)', shadowBlur: 8, shadowOffsetY: 4 },
                  areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(0, 113, 227, 0.15)' }, { offset: 1, color: 'rgba(0, 113, 227, 0)' }]) }, 
                  symbolSize: 8, 
                  showSymbol: false,
                  emphasis: { focus: 'series' }
                }
              ]
            };
            chartInstance.setOption(option);
          }
        };

        onMounted(() => {
          renderChart();
          let resizeObserver = null;
          
          if (typeof ResizeObserver !== 'undefined' && chartRef.value) {
            resizeObserver = new ResizeObserver(() => {
              if (chartInstance) {
                chartInstance.resize();
              }
            });
            resizeObserver.observe(chartRef.value);
          } else {
             window.addEventListener('resize', () => { if (chartInstance) chartInstance.resize(); });
          }

          // 清理
          watch(() => props.trendData, () => {
             // ... data change handled by outer watcher
          }, { 
             onCleanup: () => {
                if(resizeObserver) resizeObserver.disconnect();
                if(chartInstance) chartInstance.dispose();
             }
          });
        });

        return { chartRef, currentDim, currentSubPeriod, subPeriodOptions };
      }
    };

    // ---------------- Main App ----------------
    const App = {
      template: '#app-template',
      setup() {
        const currentTaskId = ref(null);
        const isContentLoading = ref(false);
        const isDiagnosisCollapsed = ref(false);
        const lastUpdated = ref(new Date());
        const alertFilter = ref('P0');
        const isFullscreen = ref(false);
        const showFullscreenPrompt = ref(false);
        const isAiOpen = ref(false);
        const isFunnelModalOpen = ref(false);
        const isAlertModalOpen = ref(false);
        const selectedFunnelStage = ref(null);
        let promptTimer = null;

        const handleFunnelDrillDown = (stage) => {
          selectedFunnelStage.value = stage;
          isFunnelModalOpen.value = true;
        };

        const toggleFullscreen = () => {
          const appElement = document.getElementById('app');
          if (!document.fullscreenElement) {
            appElement.requestFullscreen().catch(err => {
              console.error(`Error attempting to enable full-screen mode: ${err.message}`);
            });
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen();
            }
          }
        };

        const handleFullscreenChange = () => {
          isFullscreen.value = !!document.fullscreenElement;
          if (isFullscreen.value) {
            showFullscreenPrompt.value = true;
            if (promptTimer) clearTimeout(promptTimer);
            promptTimer = setTimeout(() => {
              showFullscreenPrompt.value = false;
            }, 3000);
          } else {
            showFullscreenPrompt.value = false;
          }
        };

        watch(currentTaskId, (newId) => {
           if(newId) {
              const summary = alertSummaryByTask[newId];
              if (summary) {
                 if (summary.p0_count > 0) alertFilter.value = 'P0';
                 else if (summary.p1_count > 0) alertFilter.value = 'P1';
                 else if (summary.p2_count > 0) alertFilter.value = 'P2';
                 else alertFilter.value = 'P0'; // Fallback to P0 so empty states render
              } else {
                 alertFilter.value = 'P0';
              }
           }
        }, { immediate: true });

        onMounted(() => {
          const firstTask = diagnosisData.find(d => d.severity !== 'green' && d.related_task_id);
          if (firstTask) currentTaskId.value = firstTask.related_task_id;
          document.addEventListener('fullscreenchange', handleFullscreenChange);
        });

        const triggerLoading = (cb) => {
          isContentLoading.value = true;
          setTimeout(() => { cb(); isContentLoading.value = false; }, 250);
        };

        const handleSelectDiagnosis = (d) => { if (d.related_task_id) triggerLoading(() => currentTaskId.value = d.related_task_id); };
        const handleSelectTask = (taskId) => triggerLoading(() => currentTaskId.value = taskId);
        const handleRefresh = () => lastUpdated.value = new Date();
        const handleSelectAlertFilter = (level) => {
          alertFilter.value = level;
        };

        const handleDrillDownAlerts = (level) => {
          alertFilter.value = level;
          isAlertModalOpen.value = true;
        };

        const funnelData = computed(() => currentTaskId.value ? funnelDataByTask[currentTaskId.value] : null);
        const regionData = computed(() => currentTaskId.value ? regionRankingByTask[currentTaskId.value] : null);
        const alertSummary = computed(() => currentTaskId.value ? alertSummaryByTask[currentTaskId.value] : null);
        const alertFunnelData = computed(() => currentTaskId.value ? alertFunnelByTask[currentTaskId.value] : null);
        const trendData = computed(() => currentTaskId.value ? trendDataByTask[currentTaskId.value] : null);
        const alerts = computed(() => currentTaskId.value ? alertsByTask[currentTaskId.value] : null);

        const formatTime = (date) => {
           if (!date) return '';
           return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
        };

        return { 
          diagnosisData, allTasks, currentTaskId, isContentLoading, 
          isDiagnosisCollapsed, lastUpdated, funnelData, regionData, 
          alertSummary, alertFunnelData, trendData, alerts, alertFilter, isFullscreen, showFullscreenPrompt,
          isAiOpen, isFunnelModalOpen, isAlertModalOpen, selectedFunnelStage, handleFunnelDrillDown,
          handleSelectDiagnosis, handleSelectTask, handleRefresh, toggleFullscreen,
          formatTime, handleSelectAlertFilter, handleDrillDownAlerts 
        };
      }
    };

    // 如果 Vue 存在，则初始化应用
    if (typeof Vue !== 'undefined') {
      const app = createApp(App);
      
      app.component('icon-refresh-cw', IconRefreshCw);
      app.component('icon-chevron-down', IconChevronDown);
      app.component('icon-chevron-up', IconChevronUp);
      app.component('icon-chevron-right', IconChevronRight);
      app.component('icon-trending-up', IconTrendingUp);
      app.component('icon-trending-down', IconTrendingDown);
      app.component('icon-minus', IconMinus);
      app.component('icon-alert-triangle', IconAlertTriangle);
      app.component('icon-search', IconSearch);
      app.component('icon-maximize', IconMaximize);
      app.component('icon-minimize', IconMinimize);
      app.component('icon-help-circle', IconHelpCircle);
      app.component('icon-sort', IconSort);
      app.component('icon-bot', IconBot);
      app.component('icon-x', IconX);

      app.component('ai-assistant', AiAssistant);
      app.component('diagnosis-flow', DiagnosisFlow);
      app.component('metric-cards', MetricCards);
      app.component('funnel-chart', FunnelChart);
      app.component('alert-funnel', AlertFunnel);
      app.component('region-ranking', RegionRanking);
      app.component('region-row', RegionRow);
      app.component('alert-summary', AlertSummary);
      app.component('trend-chart', TrendChart);
      app.component('alert-table', AlertTable);
      app.component('alert-drill-modal', AlertDrillModal);
      app.component('funnel-drill-modal', FunnelDrillModal);

      app.mount('#app');
    } else {
      document.body.innerHTML = '<div style="padding: 20px; color: red;">错误：无法加载 Vue 3 核心库，请检查网络连接或科学上网。</div>';
    }
  </script>
</body>
</html>
